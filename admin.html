<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Dapur Bunda Bahagia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Admin Panel - Dapur Bunda Bahagia</h1>
  </header>

  <div id="sidebar">
    <nav>
      <button class="nav-btn active" data-section="addProduct">Tambah Produk Baru</button>
      <button class="nav-btn" data-section="stockManagement">Kelola Stok Produk</button>
      <button class="nav-btn" data-section="reports">Laporan Penjualan</button>
      <button class="nav-btn" data-section="ordersManagement">Pesanan Masuk</button>
    </nav>
  </div>

  <main id="main-content">
    <section id="addProduct" class="section active">
      <h2>Tambah Produk Baru</h2>
      <form id="addProductForm" enctype="multipart/form-data">
        <label for="productName">Nama Produk:</label>
        <input type="text" id="productName" name="name" required><br><br>
        <label for="productPrice">Harga:</label>
        <input type="number" id="productPrice" name="price" step="0.01" required><br><br>
        <label for="productCategory">Kategori:</label>
        <select id="productCategory" name="category" required>
          <option value="Makanan">Makanan</option>
          <option value="Minuman">Minuman</option>
          <option value="Appetizer">Appetizer</option>
        </select><br><br>
        <label for="productStock">Stok:</label>
        <input type="number" id="productStock" name="stock_quantity" min="0" required><br><br>
        <label for="productImage">Gambar:</label>
        <input type="file" id="productImage" name="image" accept="image/*"><br><br>
        <button type="submit">Tambah Produk</button>
      </form>
    </section>

    <section id="stockManagement" class="section hidden">
      <h2>Kelola Stok Produk</h2>
      <div id="productsList"></div>
    </section>

    <section id="reports" class="section hidden">
      <h2>Laporan Penjualan</h2>
      <button id="weeklyReport">Laporan Mingguan</button>
      <button id="monthlyReport">Laporan Bulanan</button>
      <button id="resetReport">Reset Laporan</button>
      <div id="reportResult"></div>
    </section>

    <section id="ordersManagement" class="section hidden">
      <div id="orders-sub-sidebar">
        <button class="sub-nav-btn active" data-sub="pending">Pesanan Masuk (Pending)</button>
        <button class="sub-nav-btn" data-sub="completed">Pesanan Selesai (Completed)</button>
      </div>
      <div id="pendingOrders" class="sub-section active">
        <h2>Pesanan Masuk (Belum Dikonfirmasi)</h2>
        <div id="pendingOrdersList"></div>
      </div>
      <div id="completedOrders" class="sub-section hidden">
        <h2>Pesanan Sudah Dikonfirmasi</h2>
        <div id="completedOrdersList"></div>
      </div>
      <button id="fetchOrders">Muat Ulang Pesanan</button>
    </section>
  </main>

  <!-- Edit Product Modal -->
  <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; width: 400px;">
      <h3>Edit Product</h3>
      <form id="editProductForm" enctype="multipart/form-data">
        <label for="editName">Nama Produk:</label>
        <input type="text" id="editName" name="name" required><br><br>
        <label for="editPrice">Harga:</label>
        <input type="number" id="editPrice" name="price" step="0.01" required><br><br>
        <label for="editCategory">Kategori:</label>
        <select id="editCategory" name="category" required>
          <option value="Makanan">Makanan</option>
          <option value="Minuman">Minuman</option>
          <option value="Appetizer">Appetizer</option>
        </select><br><br>
        <label for="editStock">Stok:</label>
        <input type="number" id="editStock" name="stock_quantity" min="0" required><br><br>
        <label for="editImage">Gambar Baru (opsional):</label>
        <input type="file" id="editImage" name="image" accept="image/*"><br><br>
        <button type="submit">Update Produk</button>
        <button type="button" onclick="closeEditModal()">Batal</button>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
